# Single Redroid instance for a first boot on the host.
# ADB is published on 127.0.0.1 only. Do not change this to 0.0.0.0.
# The device manager writes phones.override.yml for additional instances.

services:
  phone-u1:
    image: ${SLASH_REDROID_IMAGE:-redroid/redroid:12.0.0-latest}
    privileged: true
    volumes:
      - ${SLASH_DATA_ROOT:-/srv/slash/devices}/u1/data:/data
    ports:
      - "127.0.0.1:5601:5555"
    mem_limit: 3g
    cpus: 2
    networks:
      - net-u1
    restart: "no"
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=320
      - androidboot.redroid_fps=15
      - androidboot.redroid_gpu_mode=guest
      - androidboot.redroid_net_ndns=1
      - androidboot.redroid_net_dns1=223.5.5.5
      - androidboot.use_memfd=true

  # Browser stream. Published on loopback only. Start it with:
  #   docker compose --profile takeover up -d --build ws-scrcpy
  # The image fetches the pinned commit; node_modules are not in the git tree.
  # It talks to the host adb server (adb connect 127.0.0.1:5601).
  ws-scrcpy:
    profiles: ["takeover"]
    image: slash-ws-scrcpy:pinned
    build:
      context: ../../third_party/ws-scrcpy
      dockerfile: Dockerfile
      args:
        WS_SCRCPY_REF: cd6cea6ebde17af6685c2b325183fc24bef9d52b
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ADB_HOST: host.docker.internal
      ADB_PORT: "5037"
      WS_SCRCPY_CONFIG: /opt/ws-scrcpy/config.yaml
    restart: "no"

networks:
  net-u1: {}

  # Midscene worker (vision agent). Model key comes from the host env, never a file.
  # Uses host networking so it reaches the host adb server and 127.0.0.1:<adb port>.
  midscene-worker:
    profiles: ["agent"]
    image: slash-midscene-worker:local
    build:
      context: ../../worker
    network_mode: host
    environment:
      MIDSCENE_WORKER_HOST: 127.0.0.1
      MIDSCENE_WORKER_PORT: "18790"
      MIDSCENE_WORKER_REPORT_DIR: /reports
      MIDSCENE_MODEL_BASE_URL: ${MIDSCENE_MODEL_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      MIDSCENE_MODEL_NAME: ${MIDSCENE_MODEL_NAME:-doubao-seed-2-1-turbo-260628}
      MIDSCENE_MODEL_FAMILY: ${MIDSCENE_MODEL_FAMILY:-doubao-seed}
      MIDSCENE_MODEL_API_KEY: ${MIDSCENE_MODEL_API_KEY:?set MIDSCENE_MODEL_API_KEY (e.g. from ARK_API_KEY)}
    volumes:
      - ${SLASH_DATA_ROOT:-/srv/slash/devices}/../reports:/reports
    restart: unless-stopped
