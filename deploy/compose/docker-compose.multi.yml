# Two Redroid instances. Each ADB port is bound to 127.0.0.1.
# Ports follow 5600 + sequence (u1 -> 5601, u2 -> 5602).

services:
  phone-u1:
    image: ${SLASH_REDROID_IMAGE:-redroid/redroid:12.0.0-latest}
    privileged: true
    volumes:
      - ${SLASH_DATA_ROOT:-/srv/slash/devices}/u1/data:/data
    ports:
      - "127.0.0.1:5601:5555"
    mem_limit: 3g
    cpus: 2
    networks:
      - net-u1
    restart: "no"
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=320
      - androidboot.redroid_fps=15
      - androidboot.redroid_gpu_mode=guest
      - androidboot.redroid_net_ndns=1
      - androidboot.redroid_net_dns1=223.5.5.5
      - androidboot.use_memfd=true

  phone-u2:
    image: ${SLASH_REDROID_IMAGE:-redroid/redroid:12.0.0-latest}
    privileged: true
    volumes:
      - ${SLASH_DATA_ROOT:-/srv/slash/devices}/u2/data:/data
    ports:
      - "127.0.0.1:5602:5555"
    mem_limit: 3g
    cpus: 2
    networks:
      - net-u2
    restart: "no"
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=320
      - androidboot.redroid_fps=15
      - androidboot.redroid_gpu_mode=guest
      - androidboot.redroid_net_ndns=1
      - androidboot.redroid_net_dns1=223.5.5.5
      - androidboot.use_memfd=true

  ws-scrcpy:
    profiles: ["takeover"]
    image: slash-ws-scrcpy:pinned
    build:
      context: ../../third_party/ws-scrcpy
      dockerfile: Dockerfile
      args:
        WS_SCRCPY_REF: cd6cea6ebde17af6685c2b325183fc24bef9d52b
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ADB_HOST: host.docker.internal
      ADB_PORT: "5037"
    restart: "no"

networks:
  net-u1: {}
  net-u2: {}
