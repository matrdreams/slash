name: worker
on:
  push:
  pull_request:
jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npx tsc -p . --noEmit
      - name: Mock-mode test (no model calls)
        run: npm test
        env:
          MIDSCENE_WORKER_MOCK: "1"
