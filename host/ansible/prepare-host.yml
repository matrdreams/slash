---
# Optional. Copy this repo to the host first, then point slash_repo at it.
- name: Prepare a slash Redroid host
  hosts: slash_hosts
  become: true
  vars:
    slash_repo: /opt/slash
  tasks:
    - name: Run host/install.sh
      ansible.builtin.command: "{{ slash_repo }}/host/install.sh"
      args:
        creates: /etc/modules-load.d/redroid.conf

    - name: Record check.sh
      ansible.builtin.command: "{{ slash_repo }}/host/check.sh --json"
      register: slash_check
      changed_when: false
      failed_when: false

    - name: Show check JSON
      ansible.builtin.debug:
        var: slash_check.stdout
